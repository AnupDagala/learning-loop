name: Verify Learning Loop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q content.py engine.py server.py telemetry.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser journey
        run: |
          python server.py --db /tmp/learning-loop-ci.sqlite3 --seed
          python server.py --db /tmp/learning-loop-ci.sqlite3 --port 8765 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/api/health; then break; fi
            sleep 1
          done
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: docs/evidence/
